name: 通用 OpenWrt 源码同步工具
run-name: 同步 ${{ github.event.inputs.source_repo }} 分支 ${{ github.event.inputs.target_ver }}

on:
  workflow_dispatch:
    inputs:
      source_repo:
        type: choice
        description: 选择上游源码主线
        options:
          - lede-master
          - openwrt-main
          - immortalwrt-master
          - istoreos-master
        default: immortalwrt-master

      target_ver:
        type: input
        description: 手动输入需要同步的版本分支（示例：24.10、23.05、master、main）
        default: 24.10

jobs:
  sync-branch:
    runs-on: ubuntu-latest

    env:
      SOURCE_KEY: ${{ github.event.inputs.source_repo }}
      TARGET_VER: ${{ github.event.inputs.target_ver }}

      # 映射上游仓库地址 & 个人目标仓库名
      UPSTREAM_LED_MASTER: https://github.com/coolsnowwolf/lede.git
      UPSTREAM_OPENWRT_MAIN: https://github.com/openwrt/openwrt.git
      UPSTREAM_IMM_MASTER: https://github.com/immortalwrt/immortalwrt.git
      UPSTREAM_ISTORE_MASTER: https://github.com/istoreos/istoreos.git

    steps:
      - name: 检出当前工作流仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===============================
      # 1. 解析上游仓库与目标仓库信息
      # ===============================
      - name: 解析上游仓库与目标仓库名称
        id: parse_env
        run: |
          set -euo pipefail

          UPSTREAM_URL=""
          TARGET_REPO_NAME=""
          BRANCH_PREFIX=""

          case "$SOURCE_KEY" in
            lede-master)
              UPSTREAM_URL="$UPSTREAM_LED_MASTER"
              TARGET_REPO_NAME="lede"
              BRANCH_PREFIX=""
              ;;
            openwrt-main)
              UPSTREAM_URL="$UPSTREAM_OPENWRT_MAIN"
              TARGET_REPO_NAME="openwrt"
              BRANCH_PREFIX="openwrt-"
              ;;
            immortalwrt-master)
              UPSTREAM_URL="$UPSTREAM_IMM_MASTER"
              TARGET_REPO_NAME="immortalwrt"
              BRANCH_PREFIX="openwrt-"
              ;;
            istoreos-master)
              UPSTREAM_URL="$UPSTREAM_ISTORE_MASTER"
              TARGET_REPO_NAME="istoreos"
              BRANCH_PREFIX=""
              ;;
            *)
              echo "❌ 不支持的上游源码类型"
              exit 1
              ;;
          esac

          # 构造上游分支名
          if [[ "$TARGET_VER" == "master" || "$TARGET_VER" == "main" ]]; then
            UPSTREAM_BRANCH="$TARGET_VER"
          else
            UPSTREAM_BRANCH="${BRANCH_PREFIX}${TARGET_VER}"
          fi

          echo "UPSTREAM_URL=$UPSTREAM_URL" >> $GITHUB_ENV
          echo "TARGET_REPO_NAME=$TARGET_REPO_NAME" >> $GITHUB_ENV
          echo "UPSTREAM_BRANCH=$UPSTREAM_BRANCH" >> $GITHUB_ENV
          echo "LOCAL_BRANCH=$UPSTREAM_BRANCH" >> $GITHUB_ENV

          echo "✅ 目标仓库: kygsmsc/$TARGET_REPO_NAME"
          echo "✅ 上游地址 : $UPSTREAM_URL"
          echo "✅ 同步分支 : $UPSTREAM_BRANCH"

      # ===============================
      # 2. 克隆个人目标仓库
      # ===============================
      - name: 克隆个人目标仓库
        run: |
          set -euo pipefail
          git clone \
            https://${{ secrets.PUSH_TOKEN }}@github.com/kygsmsc/${{ env.TARGET_REPO_NAME }}.git \
            target-repo
          cd target-repo
          git remote -v

      # ===============================
      # 3. Git 全局配置
      # ===============================
      - name: 配置 Git 用户与凭证
        run: |
          cd target-repo
          git config user.name "kygsmsc"
          git config user.email "kygs1@163.com"
          git config --global credential.helper '!f() { echo "username=kygsmsc"; echo "password=${{ secrets.PUSH_TOKEN }}"; }; f'


      # ===============================
      # 4. 添加上游并拉取
      # ===============================
      - name: 添加上游官方源并拉取代码
        run: |
          set -euo pipefail
          cd target-repo
          git remote remove upstream || true
          git remote add upstream ${{ env.UPSTREAM_URL }}
          git fetch upstream --tags

      # ===============================
      # 5. 同步分支（核心逻辑）
      # ===============================
      - name: 同步上游分支并推送到个人仓库
        run: |
          set -euo pipefail
          cd target-repo

          # 判断远程分支是否存在
          if git show-ref --verify --quiet refs/remotes/origin/${{ env.LOCAL_BRANCH }}; then
            echo "🔄 本地分支已存在，切换到已有分支"
            git checkout ${{ env.LOCAL_BRANCH }}
          else
            echo "🆕 本地分支不存在，基于上游创建新分支"
            git checkout -b ${{ env.LOCAL_BRANCH }} upstream/${{ env.UPSTREAM_BRANCH }}
          fi

          # 合并上游（不自动提交，方便人工干预）
          git merge upstream/${{ env.UPSTREAM_BRANCH }} \
              --no-edit \
              --allow-unrelated-histories || true

          # 推送（安全强制推送）
          git push \
            https://${{ secrets.PUSH_TOKEN }}@github.com/kygsmsc/${{ env.TARGET_REPO_NAME }}.git \
            ${{ env.LOCAL_BRANCH }} \
            --force-with-lease

          echo "✅ 同步完成：${{ env.UPSTREAM_BRANCH }} → kygsmsc/${{ env.TARGET_REPO_NAME }}:${{ env.LOCAL_BRANCH }}"
