#============================================================================================
# OpenWrt CI · 终极稳定安全版（集成版本切换）
# - 手动选择源码 / 版本 / 设备
# - 自动切换分支或 Tag（支持 kygs-immortalwrt-master + openwrt-24.10）
# - 按 device 自动加载 .config.<device>
# - SSH 安全模式（超时 + 自动保存配置）
# - feeds / 自定义脚本支持
# - 缓存隔离（源码 / 版本 / device / config）
# - 编译报表 + 缓存命中率
# - 失败保留 build_dir
# - 自动清理过期 cache
# - Release 安全模式（可选删除旧版本）
#============================================================================================

name: openwrt在线编译终极稳定版

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "选择 OpenWrt 源码仓库"
        required: true
        default: "kygs-immortalwrt-master"
        type: choice
        options:
          - lede-master
          - openwrt-main
          - openwrt-24.10
          - openwrt-23.05
          - immortalwrt-master
          - immortalwrt-24.10
          - istoreos-master
          - kygs-immortalwrt-master
          - kygs-istoreos-24.10

      version_tag:
        description: "选择源码版本（latest / 分支名 / Tag）"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - openwrt-24.10
          - v24.10.1
          - v23.05.0
          - v23.05.1
          - v23.05.2
          - v23.05.3
          - v23.05.4

      device:
        description: "选择编译设备"
        required: true
        default: "x86_64"
        type: choice
        options:
          - x86_64
          - rpi-4
          - nanopi-r2s
          - mt7621
          - mt7620
          - mt798x
          - ath79
          - ipq40xx

      config_save_path:
        description: "配置文件前缀（不含 .<device>）"
        required: true
        default: ".config"
        type: string

      ssh:
        description: "启用 SSH 连接（安全模式）"
        required: false
        default: false
        type: boolean

      ssh_timeout:
        description: "SSH 最大等待时间（分钟）"
        required: false
        default: "30"
        type: string

      delete_last_release:
        description: "是否删除上一个 Release"
        required: false
        default: "false"
        type: boolean

      use_cache:
        description: "是否使用编译缓存"
        required: false
        default: "true"
        type: boolean

env:
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  CONFIG_CCACHE: y
  CCACHE_DIR: /builder/ccache
  VERSION_TAG: ${{ github.event.inputs.version_tag }}

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device:
          - ${{ github.event.inputs.device }}
    env:
      DEVICE: ${{ matrix.device }}

    steps:
    - name: 记录开始时间
      run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

    - name: 检出仓库
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    # ==================== 基础环境 ====================
    - name: 安装编译依赖
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential ccache cmake flex bison gawk \
          gcc-multilib g++-multilib libncurses5-dev python3 git wget curl zip unzip \
          bzip2 p7zip-full rsync file gettext libssl-dev libelf-dev autopoint libtool-bin perl
        sudo apt-get -qq autoremove -y
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /builder
        sudo chown $USER:$GROUPS /builder
        ccache -M 10G

    # ==================== 源码 ====================
    - name: 解析源码仓库
      id: repo
      run: |
        INPUT="${{ github.event.inputs.source_repo }}"
        echo "DEBUG source_repo=[$INPUT]"

        case "$INPUT" in
          lede-master)
            REPO_URL=https://github.com/coolsnowwolf/lede
            REPO_BRANCH=master ;;
          openwrt-main)
            REPO_URL=https://github.com/openwrt/openwrt
            REPO_BRANCH=main ;;
          openwrt-24.10)
            REPO_URL=https://github.com/openwrt/openwrt
            REPO_BRANCH=openwrt-24.10 ;;
          openwrt-23.05)
            REPO_URL=https://github.com/openwrt/openwrt
            REPO_BRANCH=openwrt-23.05 ;;
          immortalwrt-master)
            REPO_URL=https://github.com/immortalwrt/immortalwrt
            REPO_BRANCH=master ;;
          immortalwrt-24.10)
            REPO_URL=https://github.com/immortalwrt/immortalwrt
            REPO_BRANCH=openwrt-24.10 ;;
          istoreos-master)
            REPO_URL=https://github.com/istoreos/istoreos
            REPO_BRANCH=main ;;
          kygs-immortalwrt-master)
            REPO_URL=https://github.com/kygsmsc/immortalwrt
            REPO_BRANCH=master ;;
          kygs-istoreos-24.10)
            REPO_URL=https://github.com/kygsmsc/istoreos
            REPO_BRANCH=istoreos-24.10 ;;
          *)
            echo "::error::未知 source_repo: $INPUT"
            exit 1 ;;
        esac

        echo "REPO_URL=$REPO_URL" >> $GITHUB_OUTPUT
        echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_OUTPUT

        echo "🔍 校验远程分支: $REPO_BRANCH"
        if ! git ls-remote --heads "$REPO_URL" | grep -q "refs/heads/$REPO_BRANCH"; then
          echo "::error::$REPO_URL 不存在分支 $REPO_BRANCH"
          exit 1
        fi

    - name: 克隆源码并切换版本
      working-directory: /builder
      run: |
        rm -rf openwrt
        git clone -b ${{ steps.repo.outputs.REPO_BRANCH }} \
          ${{ steps.repo.outputs.REPO_URL }} openwrt

        ln -sf /builder/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt

        TAG_INPUT="${{ env.VERSION_TAG }}"

        if [[ "$TAG_INPUT" == "latest" ]]; then
          echo "✅ 使用默认分支最新代码"

        elif [[ "$TAG_INPUT" =~ ^v[0-9] ]]; then
          echo "📌 识别为版本 Tag: $TAG_INPUT"
          git fetch --tags
          if ! git rev-parse "tags/$TAG_INPUT" >/dev/null 2>&1; then
            echo "::error::Tag $TAG_INPUT 不存在"
            exit 1
          fi
          git checkout -b build_$TAG_INPUT $TAG_INPUT

        else
          echo "📌 尝试切换为分支或 Tag: $TAG_INPUT"
          git fetch --tags
          if git rev-parse "tags/$TAG_INPUT" >/dev/null 2>&1; then
            git checkout -b build_$TAG_INPUT $TAG_INPUT
          else
            git fetch origin "$TAG_INPUT":"$TAG_INPUT"
            git checkout "$TAG_INPUT"
          fi
        fi

    # ==================== 缓存 ====================
    - name: 缓存编译目录
      if: github.event.inputs.use_cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          /builder/dl
          /builder/build_dir
          /builder/staging_dir
        key: openwrt-${{ github.event.inputs.source_repo }}-${{ env.VERSION_TAG }}-${{ matrix.device }}-${{ hashFiles(format('.config.{0}', matrix.device)) }}
        restore-keys: |
          openwrt-${{ github.event.inputs.source_repo }}-${{ env.VERSION_TAG }}-${{ matrix.device }}-

    - name: 清理缓存（禁用缓存时）
      if: github.event.inputs.use_cache == 'false'
      run: |
        sudo rm -rf /builder/dl /builder/build_dir /builder/staging_dir
        ccache -C

    # ==================== Feeds & 自定义脚本 ====================
    - name: 加载 feeds 配置
      run: |
        cd openwrt
        if [[ -f "$FEEDS_CONF" && "$FEEDS_CONF" != "feeds.conf.default" ]]; then
          cp -f "$FEEDS_CONF" feeds.conf.default
        fi

    - name: 执行自定义脚本1
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ==================== 配置 ====================
    - name: 加载设备配置
      id: load_config
      run: |
        CFG="${{ github.event.inputs.config_save_path }}.${DEVICE}"
        if [ -f "$CFG" ]; then
          cp -f "$CFG" openwrt/.config
          echo "CONFIG_TYPE=device" >> $GITHUB_OUTPUT
        elif [ -f "${{ github.event.inputs.config_save_path }}" ]; then
          cp -f "${{ github.event.inputs.config_save_path }}" openwrt/.config
          echo "CONFIG_TYPE=default" >> $GITHUB_OUTPUT
        else
          echo "::error::未找到配置文件"
          exit 1
        fi

    - name: 执行自定义脚本2
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 生成 .config
      run: |
        cd openwrt
        make defconfig
        echo "FILE_DATE=$(date +%Y.%m.%d)" >> $GITHUB_ENV

    # ==================== SSH 安全模式 ====================
    - name: SSH 远程连接（安全模式）
      if: github.event.inputs.ssh == 'true'
      uses: rdp-studio/ssh2actions@main
      timeout-minutes: ${{ fromJSON(github.event.inputs.ssh_timeout) }}
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: SSH 后保存配置
      if: github.event.inputs.ssh == 'true'
      run: |
        cd $GITHUB_WORKSPACE
        CFG="${{ github.event.inputs.config_save_path }}.${DEVICE}"
        cp -f openwrt/.config "$CFG"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add "$CFG"
        git commit -m "ci: update .config for ${DEVICE} [skip ci]" || echo "No changes"
        git push

    # ==================== 编译 ====================
    - name: 下载依赖
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -delete

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) V=w
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 失败时上传 build_dir
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build_dir_${{ matrix.device }}
        path: /builder/build_dir
        retention-days: 3

    # ==================== 发布 ====================
    - name: 整理固件
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    # ▶ 解析路由器型号 / 内核版本 / 配置名 / 发布类型
    - name: 解析固件元信息
      if: steps.compile.outputs.status == 'success'
      id: meta
      run: |
        cd openwrt

        # ▶ 路由器型号（优先 .config）
        BOARD=$(grep -E "^CONFIG_TARGET_BOARD=" .config | cut -d'"' -f2)
        [ -z "$BOARD" ] && BOARD="${{ matrix.device }}"

        # ▶ 内核版本
        KERNEL=$(grep -E "^CONFIG_KERNEL_PATCHVER=" .config | cut -d'"' -f2)
        [ -z "$KERNEL" ] && KERNEL="unknown"

        # ▶ 配置名（去扩展名）
        CFG_PATH="${{ github.event.inputs.config_save_path }}.${DEVICE}"
        [ ! -f "$CFG_PATH" ] && CFG_PATH="${{ github.event.inputs.config_save_path }}"
        CFG_NAME=$(basename "$CFG_PATH")
        CFG_NAME="${CFG_NAME%.*}"

        # ▶ 正式版 / 测试版
        if [[ "${{ env.VERSION_TAG }}" == "latest" || "${{ env.VERSION_TAG }}" == *rc* ]]; then
          BUILD_TYPE="TEST"
        else
          BUILD_TYPE="RELEASE"
        fi

        echo "BOARD=$BOARD" >> $GITHUB_OUTPUT
        echo "KERNEL=$KERNEL" >> $GITHUB_OUTPUT
        echo "CFG_NAME=$CFG_NAME" >> $GITHUB_OUTPUT
        echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_OUTPUT

    # ▶ 生成 README
    - name: 生成固件说明 README
      if: steps.compile.outputs.status == 'success'
      run: |
        cat <<EOF > ${{ env.FIRMWARE }}/README.md
        # OpenWrt Firmware

        - Project   : ${{ github.event.repository.name }}
        - Version   : ${{ env.VERSION_TAG }}
        - Kernel    : ${{ steps.meta.outputs.KERNEL }}
        - Device    : ${{ steps.meta.outputs.BOARD }}
        - Config    : ${{ steps.meta.outputs.CFG_NAME }}
        - Build     : ${{ steps.meta.outputs.BUILD_TYPE }}
        - Date      : ${{ env.FILE_DATE }}
        EOF

    - name: 删除旧 Release
      if: github.event.inputs.delete_last_release == 'true'
      uses: dev-drprasad/delete-older-releases@v0.3.0
      with:
        keep_latest: 0
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ▶ 最终 Release 名称
    - name: 创建 Release
      if: steps.compile.outputs.status == 'success'
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.repository.name }}_${{ env.VERSION_TAG }}_${{ steps.meta.outputs.BOARD }}_${{ steps.meta.outputs.KERNEL }}_${{ steps.meta.outputs.CFG_NAME }}_${{ env.FILE_DATE }}_${{ steps.meta.outputs.BUILD_TYPE }}
        name: ${{ github.event.repository.name }}_${{ env.VERSION_TAG }}_${{ steps.meta.outputs.BOARD }}_${{ steps.meta.outputs.KERNEL }}_${{ steps.meta.outputs.CFG_NAME }}_${{ env.FILE_DATE }}_${{ steps.meta.outputs.BUILD_TYPE }}
        files: |
          ${{ env.FIRMWARE }}/*
          ${{ env.FIRMWARE }}/README.md

    # ==================== 报表 ====================
    - name: 编译统计
      if: always()
      run: |
        END_TIME=$(date +%s)
        DURATION=$((END_TIME - START_TIME))
        MIN=$((DURATION / 60))
        SEC=$((DURATION % 60))

        echo "## 📊 OpenWrt 编译报表" >> $GITHUB_STEP_SUMMARY
        echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
        echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
        echo "| 设备 | ${{ matrix.device }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 路由器 | ${{ steps.meta.outputs.BOARD }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 内核 | ${{ steps.meta.outputs.KERNEL }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 源码 | ${{ github.event.inputs.source_repo }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 版本 | ${{ env.VERSION_TAG }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 配置 | ${{ steps.meta.outputs.CFG_NAME }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 构建类型 | ${{ steps.meta.outputs.BUILD_TYPE }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 构建缓存 | $( [ -d /builder/build_dir ] && echo '✅ HIT' || echo '❌ MISS' ) |" >> $GITHUB_STEP_SUMMARY
        echo "| ccache | $( [ -d /builder/ccache ] && echo '✅ HIT' || echo '❌ MISS' ) |" >> $GITHUB_STEP_SUMMARY
        echo "| 耗时 | ${MIN}m ${SEC}s |" >> $GITHUB_STEP_SUMMARY

    # ==================== 清理过期 Cache ====================
    - name: 清理过期 Cache
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const caches = await github.rest.actions.getActionsCacheList({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          const now = Date.now();
          const maxAge = 7 * 24 * 60 * 60 * 1000;
          for (const c of caches.data.actions_caches) {
            if (now - new Date(c.created_at).getTime() > maxAge) {
              await github.rest.actions.deleteActionsCacheByKey({
                owner: context.repo.owner,
                repo: context.repo.repo,
                key: c.key
              });
            }
          }
