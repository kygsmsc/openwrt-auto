name: 2-openwrt在线批量编译终极稳定

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "选择 OpenWrt 源码仓库"
        required: true
        default: "kygs-immortalwrt-master"
        type: choice
        options:
          - lede-master
          - openwrt-main
          - openwrt-24.10
          - openwrt-23.05
          - immortalwrt-master
          - immortalwrt-24.10
          - istoreos-master
          - kygs-immortalwrt-master
          - kygs-istoreos-24.10

      version_tag:
        description: "选择源码版本（latest / 分支名 / Tag）"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - openwrt-24.10
          - v24.10.1
          - v23.05.0
          - v23.05.1
          - v23.05.2
          - v23.05.3
          - v23.05.4

      delete_last_release:
        description: "是否删除上一个 Release"
        required: false
        default: "false"
        type: boolean

      use_cache:
        description: "是否使用编译缓存"
        required: false
        default: "true"
        type: boolean

env:
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai
  CONFIG_CCACHE: y
  CCACHE_DIR: /builder/ccache
  VERSION_TAG: ${{ github.event.inputs.version_tag }}

# ==================== ★ 新增：生成动态矩阵 ====================
jobs:
  set_matrix:
    runs-on: ubuntu-latest
    outputs:
      config_list: ${{ steps.gen.outputs.CONFIG_LIST }}
    steps:
      - uses: actions/checkout@v4

      - name: ★ 扫描并生成 config 矩阵
        id: gen
        run: |
          FILES=$(find . -maxdepth 1 -name '*.config' -printf '%f\n')
          if [ -z "$FILES" ]; then
            echo "::error::仓库根目录未找到任何 *.config 文件"
            exit 1
          fi

          echo "🔍 发现配置文件："
          echo "$FILES"

          {
            echo "CONFIG_LIST<<EOF"
            echo "$FILES" | jq -R -s 'split("\n") | map(select(length>0))'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

# ==================== 编译 Job ====================
  build:
    needs: set_matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.set_matrix.outputs.config_list) }}

    env:
      DEVICE: ${{ matrix.config }}

    steps:
    - name: 记录开始时间
      run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

    - name: 检出仓库
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    # ==================== 基础环境 ====================
    - name: 安装编译依赖
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential ccache cmake flex bison gawk \
          gcc-multilib g++-multilib libncurses5-dev python3 git wget curl zip unzip \
          bzip2 p7zip-full rsync file gettext libssl-dev libelf-dev autopoint libtool-bin perl jq
        sudo apt-get -qq autoremove -y
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /builder
        sudo chown $USER:$GROUPS /builder
        ccache -M 10G

    # ==================== 源码 ====================
    - name: 解析源码仓库
      id: repo
      run: |
        INPUT="${{ github.event.inputs.source_repo }}"
        case "$INPUT" in
          lede-master)
            REPO_URL=https://github.com/coolsnowwolf/lede
            REPO_BRANCH=master ;;
          openwrt-main)
            REPO_URL=https://github.com/openwrt/openwrt
            REPO_BRANCH=main ;;
          openwrt-24.10)
            REPO_URL=https://github.com/openwrt/openwrt
            REPO_BRANCH=openwrt-24.10 ;;
          openwrt-23.05)
            REPO_URL=https://github.com/openwrt/openwrt
            REPO_BRANCH=openwrt-23.05 ;;
          immortalwrt-master)
            REPO_URL=https://github.com/immortalwrt/immortalwrt
            REPO_BRANCH=master ;;
          immortalwrt-24.10)
            REPO_URL=https://github.com/immortalwrt/immortalwrt
            REPO_BRANCH=openwrt-24.10 ;;
          istoreos-master)
            REPO_URL=https://github.com/istoreos/istoreos
            REPO_BRANCH=main ;;
          kygs-immortalwrt-master)
            REPO_URL=https://github.com/kygsmsc/immortalwrt
            REPO_BRANCH=master ;;
          kygs-istoreos-24.10)
            REPO_URL=https://github.com/kygsmsc/istoreos
            REPO_BRANCH=istoreos-24.10 ;;
          *)
            echo "::error::未知 source_repo: $INPUT"
            exit 1 ;;
        esac

        SOURCE_REPO_NAME=$(basename "$REPO_URL" .git)
        echo "REPO_URL=$REPO_URL" >> $GITHUB_OUTPUT
        echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_OUTPUT
        echo "SOURCE_REPO_NAME=$SOURCE_REPO_NAME" >> $GITHUB_OUTPUT

    - name: 克隆源码并切换版本
      working-directory: /builder
      run: |
        rm -rf openwrt
        git clone -b ${{ steps.repo.outputs.REPO_BRANCH }} \
          ${{ steps.repo.outputs.REPO_URL }} openwrt
        ln -sf /builder/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt

        TAG_INPUT="${{ env.VERSION_TAG }}"
        if [[ "$TAG_INPUT" == "latest" ]]; then
          echo "✅ 使用默认分支最新代码"
        elif [[ "$TAG_INPUT" =~ ^v[0-9] ]]; then
          git fetch --tags
          git checkout -b build_$TAG_INPUT $TAG_INPUT
        else
          git fetch origin "$TAG_INPUT":"$TAG_INPUT"
          git checkout "$TAG_INPUT"
        fi

    # ==================== 缓存 ====================
    - name: 缓存编译目录
      if: github.event.inputs.use_cache == 'true'
      uses: actions/cache@v4
      with:
        path: |
          /builder/dl
          /builder/build_dir
          /builder/staging_dir
        key: openwrt-${{ github.event.inputs.source_repo }}-${{ env.VERSION_TAG }}-${{ matrix.config }}
        restore-keys: |
          openwrt-${{ github.event.inputs.source_repo }}-${{ env.VERSION_TAG }}-${{ matrix.config }}-

    - name: 清理缓存（禁用缓存时）
      if: github.event.inputs.use_cache == 'false'
      run: |
        sudo rm -rf /builder/dl /builder/build_dir /builder/staging_dir
        ccache -C

    # ==================== Feeds & 自定义脚本 ====================
    - name: 加载 feeds 配置
      run: |
        cd openwrt
        if [[ -f "$FEEDS_CONF" && "$FEEDS_CONF" != "feeds.conf.default" ]]; then
          cp -f "$FEEDS_CONF" feeds.conf.default
        fi

    # ★ 加载当前矩阵配置 & 解析设备信息
    - name: ★ 加载当前矩阵配置 & 解析设备信息
      id: load_config
      run: |
        CFG_FILE="${{ matrix.config }}"
        SRC="$GITHUB_WORKSPACE/$CFG_FILE"
        [ ! -f "$SRC" ] && echo "::error::$CFG_FILE 不存在" && exit 1

        cp -f "$SRC" openwrt/.config

        DEVICE_NAME="${CFG_FILE%.*}"
        TARGET_BOARD=$(grep -E '^CONFIG_TARGET_BOARD=' openwrt/.config | cut -d'"' -f2)
        TARGET_PROFILE=$(grep -E '^CONFIG_TARGET_PROFILE=' openwrt/.config | cut -d'"' -f2)

        echo "DEVICE_NAME=$DEVICE_NAME" >> $GITHUB_OUTPUT
        echo "FINAL_DEVICE=${TARGET_PROFILE:-$DEVICE_NAME}" >> $GITHUB_OUTPUT

    - name: 执行自定义脚本1
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 执行自定义脚本2
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 生成 .config
      run: |
        cd openwrt
        make defconfig
        echo "FILE_DATE=$(date +%Y.%m.%d)" >> $GITHUB_ENV

    # ==================== 编译 ====================
    - name: 下载依赖
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -delete

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) V=w
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 失败时上传 build_dir
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build_dir_${{ matrix.config }}
        path: /builder/build_dir
        retention-days: 3

    # ==================== ★ 整理固件并上传 Artifact ====================
    - name: ★ 整理固件 & 上传 Artifact
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.config }}
        path: |
          openwrt/bin/targets/*/*/*.bin
          openwrt/bin/targets/*/*/*.img*
          openwrt/bin/targets/*/*/*.gz
        retention-days: 3

# ==================== ★ 新增：统一 Release ====================
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 删除旧 Release
        if: github.event.inputs.delete_last_release == 'true'
        uses: dev-drprasad/delete-older-releases@v0.3.0
        with:
          keep_latest: 0
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ★ 下载所有固件 Artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware

      - name: ★ 创建唯一 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.source_repo }}_${{ env.VERSION_TAG }}_${{ github.run_id }}
          name: ${{ github.event.inputs.source_repo }}_${{ env.VERSION_TAG }}_全设备_${{ github.run_id }}
          files: |
            firmware/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
