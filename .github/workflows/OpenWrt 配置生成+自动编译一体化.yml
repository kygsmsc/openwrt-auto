#============================================================================================
# https://github.com/P3TERX/Actions-OpenWrt
# https://github.com/ophub/amlogic-s9xxx-openwrt
# https://github.com/3wlh/Actions-OpenWrt
# openwrt:一体化工作流
# 功能:选择源码→加载自定义配置→生成配置→自动保存配置→编译固件→发布版本
# 修复项：补充仓库写入权限、精简冗余命令、修复语法风险、优化日志、保留全部旧代码注释
# 缓存优化：分离源码/缓存目录，修复hashFiles失效，消除git clone目录冲突，提升缓存命中率
#============================================================================================
name: OpenWrt 配置生成+自动编译一体化

# 【新增】权限声明：新版GH Actions默认只读，必须开启write才能提交/推送文件回仓库
permissions:
  contents: write

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "选择 OpenWrt 源码仓库"
        required: true
        default: "kygs-immortalwrt-master"
        type: choice
        options:
          - lede-master
          - openwrt-main
          - openwrt-24.10
          - openwrt-23.05
          - immortalwrt-master
          - immortalwrt-24.10
          - istoreos-master
          - kygs-immortalwrt-master
          - kygs-istoreos-24.10
          
      version_tag:
        description: "选择源码版本 Tag（ latest = 最新代码；openwrt-24.10 为分支，其余v开头为版本标签）"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - openwrt-24.10
          - v24.10.1
          - v23.05.0
          - v23.05.1
          - v23.05.2
          - v23.05.3
          - v23.05.4
          
      ssh:
        description: "启用 SSH 连接（可在线 make menuconfig）"
        required: false
        default: true
        type: boolean
        
      config_save_path:
        description: "配置文件保存到仓库的路径（默认即可）"
        required: true
        default: ".config"
        type: text

      delete_last_release:
        description: "是否删除【上一个旧版本】？默认不删除"
        required: false
        default: "false"
        type: boolean

env:
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  DIY_P3_SH: diy-part3.sh
  TZ: Asia/Shanghai
  UPLOAD_RELEASE: true
  UPLOAD_FIRMWARE: true
  # ★修改原因：原全局环境缺失该变量，上传bin步骤判断会失效，导致无法上传bin目录产物
  UPLOAD_BIN_DIR: true
  CONFIG_CCACHE: y          # 开启 ccache 加速
  CCACHE_DIR: /builder/ccache
  # 区分Tag版本缓存，避免切换版本缓存错乱
  VERSION_TAG: ${{ github.event.inputs.version_tag }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4  # 【优化】升级为官方稳定v4版本，兼容性更好
      with:
        persist-credentials: true

    # ==================== 提速优化 1：安装编译依赖 & ccache ====================
    - name: 安装编译环境依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential ccache cmake flex bison gawk gcc-multilib g++-multilib libncurses5-dev python3 git wget curl zip unzip bzip2 p7zip-full rsync file gettext libssl-dev libelf-dev autopoint libtool-bin perl
        # ubuntu22.04自带python3.10，删除多余python3.9安装避免冲突
        # sudo apt-get install python3.9
        # 【精简】删除无用 systemctl daemon-reload
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean && sudo -E apt-get -qq autoclean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /builder
        sudo chown $USER:$GROUPS /builder
        ccache -M 10G

    - name: 自动匹配仓库地址与分支
      id: repo
      run: |
        case "${{ github.event.inputs.source_repo }}" in
          lede-master)
            REPO_URL="https://github.com/coolsnowwolf/lede"
            REPO_BRANCH="master" ;;
          openwrt-main)
            REPO_URL="https://github.com/openwrt/openwrt"
            REPO_BRANCH="main" ;;
          openwrt-24.10)
            REPO_URL="https://github.com/openwrt/openwrt"
            REPO_BRANCH="openwrt-24.10" ;;
          openwrt-23.05)
            REPO_URL="https://github.com/openwrt/openwrt"
            REPO_BRANCH="openwrt-23.05" ;;
          immortalwrt-master)
            REPO_URL="https://github.com/immortalwrt/immortalwrt"
            REPO_BRANCH="master" ;;
          immortalwrt-24.10)
            REPO_URL="https://github.com/immortalwrt/immortalwrt"
            REPO_BRANCH="openwrt-24.10" ;;
          istoreos-master)
            REPO_URL="https://github.com/istoreos/istoreos"
            REPO_BRANCH="main" ;;
          kygs-immortalwrt-master)
            REPO_URL="https://github.com/kygsmsc/immortalwrt"
            REPO_BRANCH="master" ;;
          kygs-istoreos-24.10)
            REPO_URL="https://github.com/kygsmsc/istoreos"
            REPO_BRANCH="istoreos-24.10" ;;
          *)
            echo "::error::未定义仓库" && exit 1 ;;
        esac
        echo "REPO_URL=$REPO_URL" >> $GITHUB_OUTPUT
        echo "REPO_BRANCH=$REPO_BRANCH" >> $GITHUB_OUTPUT

        # 校验远程分支是否存在，提前终止错误流程
        echo "正在校验远程分支: $REPO_BRANCH"
        # 【修复】原语法无问题，精简写法，保留原有逻辑
        if ! git ls-remote --heads "$REPO_URL" | grep -q "refs/heads/$REPO_BRANCH"; then
          echo "::error::远程仓库不存在分支 $REPO_BRANCH，请重新选择源码仓库！"
          exit 1
        fi

    # ==================== 提速优化 2：编译缓存（重构分离缓存目录，修复hash失效） ====================
    - name: 缓存 OpenWrt 编译文件
      uses: actions/cache@v4
      # ★修改原因：v3.3.2已被官方标记废弃，更换v4稳定官方版本消除告警
      with:
        # 缓存全部放在/builder下独立目录，不再嵌套openwrt，不会自动生成openwrt文件夹
        path: |
          /builder/dl
          /builder/build_dir
          /builder/staging_dir
          /builder/ccache
        # hashFiles读取仓库根目录.config，路径真实存在，配置变更自动换缓存key
        key: openwrt-${{ github.event.inputs.source_repo }}-${{ env.VERSION_TAG }}-${{ hashFiles('.config') }}
        restore-keys: |
          openwrt-${{ github.event.inputs.source_repo }}-

    - name: 克隆 OpenWrt 源码
      id: clone_src
      working-directory: /builder
      run: |
        # ★修改原因：缓存恢复会自动生成openwrt空目录，克隆前强制删除，彻底解决git clone 128目录冲突报错
        rm -rf openwrt
        git clone -b ${{ steps.repo.outputs.REPO_BRANCH }} ${{ steps.repo.outputs.REPO_URL }} openwrt
        ln -sf /builder/openwrt $GITHUB_WORKSPACE/openwrt
        cd openwrt

        # ★修改原因：缓存目录与源码目录物理分离，软链接挂载dl/build_dir/staging_dir，编译逻辑无需改动，避免缓存嵌套导致目录残留
        mkdir -p /builder/dl /builder/build_dir /builder/staging_dir
        ln -sf /builder/dl dl
        ln -sf /builder/build_dir build_dir
        ln -sf /builder/staging_dir staging_dir

        # 【注释保留原有Tag切换旧代码】
        # if [ "${{ github.event.inputs.version_tag }}" != "latest" ]; then
        #   git fetch --tags 2>/dev/null || true
        #   git checkout ${{ github.event.inputs.version_tag }} 2>/dev/null || echo "使用分支最新代码"
        # fi
        # ★修改原因：分三段逻辑处理，1.latest直接保留默认分支；2.v+数字开头为版本Tag校验；3.其余名称先校验是否存在远程Tag，存在切Tag，不存在则切远程分支，完全匹配下拉选项需求
        TAG_INPUT="${{ github.event.inputs.version_tag }}"
        if [[ "$TAG_INPUT" == "latest" ]]; then
            echo "✅ 选择latest，使用克隆默认分支，不执行任何切换操作"
        elif [[ "$TAG_INPUT" =~ ^v[0-9] ]]; then
            echo "========== 识别为版本标签 $TAG_INPUT，开始校验拉取 =========="
            git fetch --tags
            if ! git rev-parse "tags/$TAG_INPUT" >/dev/null 2>&1; then
        echo "::error::标签 $TAG_INPUT 在当前源码仓库不存在！"
        exit 1
            fi
            git checkout -b tag_build_$TAG_INPUT $TAG_INPUT
            echo "✅ 新建临时分支 tag_build_$TAG_INPUT 绑定标签，避免游离HEAD"
        else
            echo "========== 非v开头参数，先校验是否为远程标签 $TAG_INPUT =========="
            git fetch --tags
            if git rev-parse "tags/$TAG_INPUT" >/dev/null 2>&1; then
                echo "✅ 检测到存在同名Tag，切换标签 $TAG_INPUT"
                git checkout -b tag_build_$TAG_INPUT $TAG_INPUT
                    else
                echo "========== 无对应Tag，切换远程分支 $TAG_INPUT =========="
                git fetch origin "$TAG_INPUT":"$TAG_INPUT"
                git checkout "$TAG_INPUT"
                echo "✅ 成功切换至远程分支 $TAG_INPUT"
            fi
        fi

        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: 加载 feeds 配置
      run: |
        cd openwrt
        if [[ -f "$FEEDS_CONF" && "$FEEDS_CONF" != "feeds.conf.default" ]]; then
          cp -f "$FEEDS_CONF" feeds.conf.default
        fi
        
    - name: 执行自定义脚本1
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新并安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ==============================================================
    # 加载自定义配置：读取 config_save_path 指定文件 → 写入 openwrt/.config
    # 完全沿用你要求的变量逻辑，旧代码完整注释保留
    # ==============================================================
    - name: 加载自定义配置
      run: |
        [ -e files ] && cp -rf files openwrt/
        CFG_FILE="${{ github.event.inputs.config_save_path }}"
        if [[ -f "${CFG_FILE}" ]]; then
          cp -f "${CFG_FILE}" openwrt/.config
          echo "✅ 成功将仓库根目录 ${CFG_FILE} 复制到 openwrt/.config"
        else
          echo "⚠️ 未找到配置文件 ${CFG_FILE}，使用源码默认配置"
        fi

        # 【注释保留最初旧逻辑】
        # if [ -f ".config" ]; then
        # cp -f .config openwrt/.config
        # echo "✅ 成功将仓库根目录的 .config 复制到 openwrt/.config"
        # elif [ -f "config.seed" ]; then
        # cp -f config.seed openwrt/.config
        # echo "✅ 使用 config.seed 作为配置文件"
        # else
        # echo "⚠️ 未找到自定义配置文件，使用默认配置"
        # fi

    - name: 执行自定义脚本2
      run: |
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH 远程连接（可选）
      if: github.event.inputs.ssh == 'true'
      uses: rdp-studio/ssh2actions@main
      # ★修改原因：原v1标签不存在，切换main分支避免无法拉取action报错
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    - name: 生成 .config 配置文件
      run: |
        cd openwrt
        make defconfig
        echo "FILE_DATE=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        
    - name: 自动保存配置文件到仓库
      run: |
        cd "$GITHUB_WORKSPACE"
        CONFIG_PATH="${{ github.event.inputs.config_save_path }}"

        echo -e "\033[34m===== 开始打印 openwrt/.config 配置内容 =====\033[0m"
        cat openwrt/.config
        echo -e "\033[34m===== .config内容打印完毕 =====\033[0m"

        # 将编译后新配置写回仓库指定文件
        if cp -f openwrt/.config "$CONFIG_PATH"; then
          echo -e "\033[32m✅ 文件复制成功：已将.config保存至 => $CONFIG_PATH\033[0m"
        else
          echo -e "\033[31m❌ 文件复制失败：无法拷贝.config到 $CONFIG_PATH\033[0m"
        fi

        # Git 提交推送
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add -f "$CONFIG_PATH"

        if git commit -m "Auto update config [$(date +%Y-%m-%d)]" --allow-empty; then
          echo -e "\033[32m✅ Git提交配置文件成功\033[0m"
        else
          echo -e "\033[33m⚠️ 无配置变更，本次无需提交\033[0m"
        fi

        # ★修改原因：--force强制推送会覆盖远端仓库历史，多人协作极易丢失配置文件，移除强制参数
        if git push; then
          echo -e "\033[32m✅ 配置文件已成功推送至远程仓库\033[0m"
        else
          echo -e "\033[31m❌ Git推送远程仓库失败\033[0m"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
      # ★修改原因：原continue-on-error写在env同级，yaml语法无效，必须和run同级缩进才能生效

    # ==================== 下载编译依赖包 ====================
    - name: 下载编译依赖
      run: |
        cd openwrt
        # 【精简】前面已执行make defconfig，此处保留但不重复冗余提示
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -delete

    # ==================== 编译固件 ====================
    - name: 开始编译固件
      id: compile_firmware
      # ★修改原因：原无id，后续上传bin步骤引用steps.compile不存在，判断逻辑失效，新增唯一id用于下游判断
      if: steps.clone_src.outputs.status == 'success'
      run: |
        cd openwrt
        make -j$(nproc) V=w
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> $GITHUB_ENV

    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 上传bin目录产物
      uses: actions/upload-artifact@v4
      # ★修改原因：原@main不稳定，锁定官方v4稳定版本，防止上游变更导致流水线崩溃；同步编译步骤id为compile_firmware，修复变量引用不存在问题
      if: steps.compile_firmware.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: 整理固件目录
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件目录
      uses: actions/upload-artifact@v4
      # ★修改原因：原@main不稳定，锁定官方v4稳定版本，防止上游变更导致流水线崩溃
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: 生成发布标签
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 创建版本发布
      uses: softprops/action-gh-release@v1
      # ★修改原因：原@master分支不稳定，锁定v1稳定tag，避免发布功能失效
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: 清理历史工作流记录
      uses: Mattraks/delete-workflow-runs@v2
      # ★修改原因：原@master不稳定，锁定v2稳定tag
      with:
        retain_days: 7
        # ★修改原因：原0会立即删除所有运行日志，编译出错无法回溯排查，保留7天日志
        keep_minimum_runs: 3
        # ★修改原因：最低保留3次运行记录，防止日志全部清空
    - name: 删除旧版本Release
      if: github.event.inputs.delete_last_release == 'true' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      uses: dev-drprasad/delete-older-releases@v0.3.0
      # ★修改原因：原@master不稳定，锁定固定版本tag保证删除release功能稳定
      with:
        keep_latest: 1
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
